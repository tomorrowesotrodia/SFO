<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>舊金山五天四夜高執行力旅遊手冊</title>
<style>
:root{--primary-color:#1A2C42;--secondary-color:#6A4A4D;--accent-color:#805A5D;--background-color:#f4f5f7;--card-bg:#fff;--text-color:#333;--border-color:#d1d5db;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;color:var(--text-color);background:var(--background-color);margin:0;-webkit-text-size-adjust:100%}
.container{max-width:800px;margin:0 auto;padding:15px}
header{text-align:center;margin-bottom:12px;padding:20px 15px;background:var(--primary-color);color:#fff;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,.1)}
h1{margin:0 0 5px;font-size:1.5rem}.subtitle{font-size:.9rem;opacity:.9;margin:0}
.info-box{background:var(--card-bg);padding:15px;border-radius:8px;margin-bottom:20px;border-left:4px solid var(--accent-color);box-shadow:0 2px 4px rgba(0,0,0,.05);font-size:.95rem}
.budget-tracker{border-left-color:var(--primary-color);background:#f0f4f8}
.budget-stats{display:flex;flex-direction:column;gap:8px;font-weight:bold;margin-bottom:15px;font-size:1rem}
.budget-stats>div{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed #d1d5db;padding-bottom:8px}
.budget-stats>div:last-child{border-bottom:none;padding-bottom:0}
.budget-stats .remaining{color:#27ae60}.twd-text{font-size:.85rem;color:#7f8c8d;font-weight:normal;margin-left:5px}
input[type=text],input[type=number],button{-webkit-appearance:none;appearance:none;box-sizing:border-box;height:48px;font-size:16px!important;border-radius:8px;margin:0;outline:none}
input[type=text],input[type=number]{padding:0 15px;border:1px solid var(--border-color);background:#fff;color:var(--text-color);width:100%}
button{background:var(--secondary-color);color:#fff;border:none;font-weight:bold;padding:0 15px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;white-space:nowrap}
button:active{background:var(--accent-color)}
.expense-input{display:flex;flex-direction:column;gap:10px;margin-bottom:15px}
.expense-amount-row,.inline-action-row{display:flex;gap:10px;width:100%}
.expense-amount-row input,.inline-action-row input{flex:1.5}.expense-amount-row button,.inline-action-row button{flex:1}
.inline-expense-container{display:flex;flex-direction:column;gap:10px;margin-top:15px;padding-top:15px;border-top:1px dashed var(--border-color);width:100%}
.summary-table-container{overflow-x:auto;margin-top:15px;border-radius:8px}
.summary-table{width:100%;border-collapse:collapse;background:#fff;font-size:.9rem;min-width:300px}
.summary-table th,.summary-table td{padding:10px 12px;text-align:left;border-bottom:1px solid #f0f0f0}
.summary-table th{background:var(--primary-color);color:#fff;font-weight:500;font-size:.85rem}
.summary-table tfoot th{background:#e2e8f0;color:#333;font-weight:bold;border-top:2px solid #ccc}
.delete-btn-table{color:#e74c3c;background:none;border:none;font-size:1.2rem;padding:0 5px;height:auto;width:auto}
.sticky-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--background-color);padding:6px 0;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs a{flex:1;text-align:center;padding:10px 0;border-radius:8px;background:#e3e6ea;color:var(--primary-color);text-decoration:none;font-weight:600;font-size:.95rem}
.tabs a.active{background:var(--secondary-color);color:#fff}
.day-nav{display:flex;gap:6px}
.day-nav a{flex:1;text-align:center;background:var(--primary-color);color:#fff;text-decoration:none;border-radius:8px;padding:8px 0;font-size:.85rem;font-weight:500;line-height:1.3}
.day-nav a small{display:block;opacity:.8;font-size:.7rem}
.day-card{scroll-margin-top:130px;background:var(--card-bg);border-radius:8px;margin-bottom:25px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden}
.day-header{background:var(--secondary-color);color:#fff;padding:15px;margin:0;font-size:1.1rem;display:flex;flex-direction:column}
.day-header span{font-size:.9rem;opacity:.9;margin-top:4px}.day-header span:first-child{font-size:1.1rem;opacity:1;margin-top:0}
.timeline{padding:0;margin:0;list-style:none}
.timeline-item{display:flex;padding:15px;border-bottom:1px solid var(--border-color);flex-direction:column}
.timeline-item:last-child{border-bottom:none}
.time-col{font-weight:bold;color:var(--primary-color);font-size:.95rem;margin-bottom:5px;border-bottom:1px solid #f0f0f0;padding-bottom:5px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.content-col{flex:1}
.location-title{margin:0 0 8px;font-size:1.05rem;color:var(--primary-color)}
.description-text{font-size:.9rem;color:#555;margin-bottom:10px}
.nav-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent-color);color:#fff;text-decoration:none;padding:10px 15px;border-radius:8px;font-size:.9rem;font-weight:500;margin:5px 0 10px;width:100%;box-sizing:border-box}
.nav-icon{margin-right:8px;font-size:1.1rem}
.food-recommendation{background:#f8f4f4;padding:10px 12px;border-radius:6px;font-size:.9rem;margin-top:5px;border-left:3px solid var(--secondary-color)}
.food-title{font-weight:bold;color:var(--secondary-color);margin-bottom:3px;display:block}
.highlight-tag{display:inline-block;background:#ffd700;color:#333;padding:2px 6px;border-radius:4px;font-size:.8rem;font-weight:bold;margin-left:5px;vertical-align:middle}
.warning-wrap{padding:12px 15px;background:#fff0f0;border-bottom:1px solid var(--border-color)}
.warning-text{color:#d32f2f;font-weight:bold;font-size:.9rem}
.safety-alert{background:#fdecea;border-left:4px solid #d32f2f;color:#b71c1c;padding:10px 12px;border-radius:6px;font-size:.9rem;font-weight:bold;line-height:1.5;margin:8px 0 10px}
.tl-tag{display:inline-block;background:#fdecea;color:#d32f2f;border:1px solid #f5c6c6;font-size:.72rem;font-weight:bold;line-height:1.4;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.mode-group{margin:5px 0 10px}.mode-label{font-size:.9rem;font-weight:600;color:var(--primary-color);margin-bottom:6px}
.mode-label small{font-weight:normal;color:#888;font-size:.75rem}.mode-row{display:flex;gap:6px}
.mode-btn{flex:1;text-align:center;text-decoration:none;background:var(--accent-color);color:#fff;padding:11px 4px;border-radius:8px;font-size:.85rem;font-weight:500;white-space:nowrap}
.mode-btn.mode-uber{background:#111}
/* 完成 / 略過 / 改時間 */
.time-row{display:flex;align-items:center;gap:10px;flex:1;min-width:140px}
.done-cb{width:28px;height:28px;accent-color:#27ae60;flex:none;margin:0}
.item-tools{display:flex;gap:6px}
.item-tools button,.time-editor button,.todo-row button{height:34px;width:auto;padding:0 12px;font-size:13px!important;font-weight:600;background:#e8eaee;color:var(--primary-color);border-radius:6px}
.item-tools button.on{background:var(--secondary-color);color:#fff}
.time-editor{display:none;flex-basis:100%;gap:6px;align-items:center}.time-editor.open{display:flex}
.time-editor input[type=text]{height:38px;flex:1;padding:0 10px}
.time-editor button.save{background:var(--primary-color);color:#fff}
.edited-tag{background:#fff3cd;color:#8a6d00;font-size:.7rem;padding:1px 6px;border-radius:4px;margin-left:6px}
.timeline-item.done{background:#f3faf5}.timeline-item.done .location-title{text-decoration:line-through;color:#7a8a80}
.timeline-item.skipped{background:#f1f1f1}.timeline-item.skipped .time-text,.timeline-item.skipped .location-title{text-decoration:line-through;color:#999}
.timeline-item.skipped .content-col>:not(.location-title){display:none}
.day-progress{font-size:.85rem}
.reset-all{margin:10px 0 30px;background:#999}
/* 未完成頁 */
#view-todo{display:none}
.todo-intro{background:#fff;border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 2px 4px rgba(0,0,0,.05);font-size:.95rem}
.todo-day{background:#fff;border-radius:8px;margin-bottom:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.todo-day h3{margin:0;padding:12px 15px;background:var(--secondary-color);color:#fff;font-size:1rem}
.todo-row{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid #eee;flex-wrap:wrap}
.todo-row:last-child{border-bottom:none}
.todo-main{flex:1;min-width:150px}.todo-main b{color:var(--primary-color)}.todo-main small{display:block;color:#888}
.todo-empty{padding:20px;text-align:center;color:#27ae60;font-weight:bold}
.todo-row a{font-size:13px;font-weight:600;color:var(--accent-color);text-decoration:none;padding:6px 8px}
.badge{background:#d32f2f;color:#fff;border-radius:10px;font-size:.75rem;padding:0 7px;margin-left:5px}
</style>
</head>
<body>
<div class="container">
<header><h1>🌉 舊金山五天四夜行程</h1><p class="subtitle">2026/11/12 - 11/16</p></header>

<div class="sticky-top">
  <div class="tabs"><a href="#itinerary" id="tab-itin" class="active">📅 行程</a><a href="#todo" id="tab-todo">📋 未完成清單<span class="badge" id="todo-badge" style="display:none">0</span></a></div>
  <nav class="day-nav" id="day-nav">
    <a href="#day1">Day 1<small>11/12 四</small></a><a href="#day2">Day 2<small>11/13 五</small></a><a href="#day3">Day 3<small>11/14 六</small></a><a href="#day4">Day 4<small>11/15 日</small></a><a href="#day5">Day 5<small>11/16 一</small></a>
  </nav>
</div>

<div id="view-itin">
<div class="info-box budget-tracker">
<h3 style="margin:0 0 15px;color:var(--primary-color)">💰 預算控管</h3>
<div class="budget-stats">
<div><span>總預算</span><span>$<span id="total-budget">600</span> <span class="twd-text">(約 NT$<span id="total-budget-twd"></span>)</span></span></div>
<div><span>已花費</span><span>$<span id="total-spent">0</span> <span class="twd-text">(約 NT$<span id="total-spent-twd">0</span>)</span></span></div>
<div class="remaining"><span>剩餘預算</span><span>$<span id="remaining-budget">600</span> <span class="twd-text">(約 NT$<span id="remaining-budget-twd"></span>)</span></span></div>
</div>
<div class="expense-input"><input type="text" id="expense-name" placeholder="項目 (例: 晚餐)"><div class="expense-amount-row"><input type="number" id="expense-amount" placeholder="金額 (USD)" step="0.01"><button onclick="addExpense()">記一筆</button></div></div>
<div class="summary-table-container"><table class="summary-table"><thead><tr><th>項目</th><th>USD</th><th>TWD</th><th style="text-align:center">操作</th></tr></thead><tbody id="expense-tbody"></tbody><tfoot><tr><th>總計</th><th id="table-total-usd">$0.00</th><th id="table-total-twd">NT$0</th><th></th></tr></tfoot></table></div>
</div>
<div id="days"></div>
<button class="reset-all" id="reset-all">重設所有勾選與調整</button>
</div>

<div id="view-todo">
<div class="todo-intro" id="todo-intro"></div>
<div id="todo-list"></div>
</div>
</div>

<script>
/* ---------- 連結小工具 ---------- */
const HOME="Chapter San Francisco, 1533 Franklin St, San Francisco, CA 94109";
const E=encodeURIComponent;
const U=a=>"https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff%5Bformatted_address%5D="+E(a);
const G=(a,m)=>"https://www.google.com/maps/dir/?api=1&destination="+E(a)+"&travelmode="+m;
const MG=(label,addr)=>`<div class="mode-group"><div class="mode-label">📍 ${label}　<small>選擇交通方式</small></div><div class="mode-row"><a href="${U(addr)}" target="_blank" class="mode-btn mode-uber">🚕 Uber</a><a href="${G(addr,'transit')}" target="_blank" class="mode-btn">🚌 公車/地鐵</a><a href="${G(addr,'walking')}" target="_blank" class="mode-btn">🚶 步行</a></div></div>`;
const N=(label,o,d,m)=>`<a href="https://www.google.com/maps/dir/?api=1&origin=${E(o)}&destination=${E(d)}&travelmode=${m}" target="_blank" class="nav-btn"><span class="nav-icon">🧭</span> ${label}</a>`;
const D=t=>`<p class="description-text">${t}</p>`;
const F=(t,x)=>`<div class="food-recommendation"><span class="food-title">${t}</span>${x}</div>`;
const A=t=>`<div class="safety-alert">🚨 ${t}</div>`;
const TL='<span class="tl-tag">Tenderloin 邊緣</span>';
const HL=t=>`<span class="highlight-tag">${t}</span>`;

/* ---------- 行程資料（s=1 代表景點/餐廳，有完成勾選框，會出現在未完成清單） ---------- */
const DAYS=[
{id:"day1",n:1,h:"Day 1 (11/12 週四)",sub:"出發、Polk St、Painted Ladies 與市政廳",items:[
{t:"06:30",h:"自墨西哥出發"},{t:"07:30",h:"搭乘 Trolley 藍線"},{t:"08:20",h:"轉乘接駁至 SAN 機場"},{t:"08:45",h:"抵達 SAN 機場報到"},
{t:"12:37",h:"抵達 SFO 機場，搭 BART 往市區",b:D("前往<strong>國際線航廈 3 樓</strong>，順著 BART 指標走，搭到市區聯合廣場的 <strong>Powell Street 站</strong>（約 30 分鐘）。")+N("機場 ➔ Powell St 站 (BART)","SFO","Powell St BART Station, San Francisco","transit")+F("💰 票價","單程約 $11–12，可用 Clipper 或感應式信用卡/金融卡進出站（感應卡進出站請用同一張）。")},
{t:"約 13:30",h:"Powell St 站，前往住宿點 "+TL,b:N("Powell St 站 ➔ Chapter SF (大眾運輸)","Powell St BART Station, San Francisco","Chapter San Francisco","transit")},
{t:"約 14:00",h:'抵達 Chapter SF 寄放行李 <span class="tl-tag">鄰近 Tenderloin 西側</span>',b:N("住宿 ➔ Cris 二手店 (步行)","Chapter San Francisco","Cris Consignment, San Francisco","walking")},
{t:"約 14:30",s:1,h:"Cris Consignment 二手店",b:D("Polk St 商圈與二手店尋寶，約 1 小時。週四營業到 18:00。")+N("二手店 ➔ Painted Ladies (大眾運輸)","Cris Consignment, San Francisco","Painted Ladies, Alamo Square, San Francisco","transit")},
{t:"約 15:45",s:1,h:"Painted Ladies (Alamo Square) "+HL("明信片機位"),b:D("舊金山最經典的彩色維多利亞式排屋。到 Alamo Square 公園坡頂拍攝，背景是市中心天際線，停留約 30 分鐘。")+MG("Painted Ladies ➔ Haight St","1698 Haight St, San Francisco, CA 94117")},
{t:"約 16:30",s:1,h:"1698 Haight St（Haight-Ashbury）",b:D("1698 Haight St, San Francisco, CA 94117, United States")+F("📝 備註","買紀念品磁鐵 🧲")+MG("Haight St ➔ 市政廳","San Francisco City Hall, 1 Dr Carlton B Goodlett Pl, San Francisco")},
{t:"約 17:15",s:1,h:"三藩市市政廳 (City Hall) "+TL,b:D("從 Alamo Square 往東步行過來，欣賞外觀並拍照。")+A("傍晚的 Civic Center 請小心：在 Polk St 側的正面拍照約 10 分鐘就離開，不要往 Market St / UN Plaza 方向走。")+MG("市政廳 ➔ 晚餐","Izakaya Yoki, 900 Bush St, San Francisco")},
{t:"18:00",s:1,h:"晚餐時間 "+TL,b:A("Izakaya Yoki（900 Bush St）在 Lower Nob Hill，緊鄰 Tenderloin 北緣。請在店門口上下車，天黑後不要步行，一律叫 Uber 回旅館。")+MG("晚餐 ➔ 住宿",HOME)+F("🍣 晚餐","Izakaya Yoki (900 Bush St，日韓料理)<br><small>*評論提到可能是限時吃到飽，訂位時問清楚；週四營業時間請先確認，建議先訂位。</small>")}
]},
{id:"day2",n:2,h:"Day 2 (11/13 週五)",sub:"金門大橋娃娃明信片、Lands End 日落",items:[
{t:"07:45",h:"由 Chapter SF 出發",b:MG("住宿 ➔ Brenda's（約 5 分鐘）","Brenda's French Soul Food, 652 Polk St, San Francisco")},
{t:"約 08:00",s:1,h:"Brenda's French Soul Food 早餐 "+'<span class="tl-tag">Tenderloin</span>',b:D("652 Polk St（Eddy 與 Turk 之間）。招牌是 Beignet 與炸鯰魚蛋 Benedict，平日早上排隊比週末短。約 09:15 吃完，叫 Uber 去 Fort Point（約 20–25 分鐘）。<br><small>*各網站營業時間不一致，多數寫 08:00 開門，出發前請查 Google Maps 或打 415-345-8100。</small>")+A("Brenda's 位於 Tenderloin。只在白天前往，在店門口上下車，用 Uber 往返，不要步行穿過周邊街區。")+MG("Brenda's ➔ Fort Point","Fort Point National Historic Site, San Francisco")+F("🥞 早餐","Brenda's French Soul Food")},
{t:"約 10:00",s:1,h:"Fort Point 海角堡",b:D("約 09:45 搭 Uber 抵達 Fort Point 附近，約 10:00 入場 Fort Point（免費，11 月通常週五至週日 10:00–17:00 開放，出發前請上 NPS 官網確認）。停留約 40 分鐘：橋底鋼構與拱形很適合拍娃娃，欄杆和鋼構可以當座位。約 10:40 沿海邊步道走去 Warming Hut（約 15 分鐘）。")+N("Fort Point ➔ Warming Hut (步行)","Fort Point National Historic Site","Warming Hut Park Store, 983 Marine Dr, San Francisco","walking")},
{t:"約 10:55",s:1,h:"Warming Hut 前的海灘與草地 "+HL("娃娃明信片機位"),b:D("Crissy Field 西段，面向大橋，一次拍到橋、海灣與沙灘。拍照約 60 分鐘，約 11:55 沿步道往東走去藝術宮（約 40–50 分鐘，沿途還有 East Beach 可拍）。<br><strong>娃娃拍法：</strong>手機壓低到跟娃娃同高，用 2 倍鏡頭，娃娃放在木頭、石頭或沙堆上，大橋虛化在背景。海風大，放娃娃時手要扶著或用小夾子固定。<br><small>*Warming Hut 營業時間我沒有核對；下午起霧機率偏高是網路說法，行前請看天氣預報。</small>")+N("Warming Hut ➔ 藝術宮 (步行)","Warming Hut Park Store","Palace of Fine Arts","walking")},
{t:"約 12:45",s:1,h:"藝術宮 (Palace of Fine Arts)",b:MG("藝術宮 ➔ As Quoted（約 10 分鐘）","As Quoted, 3613 Sacramento St, San Francisco")},

/* ---------- 記帳（原功能） ---------- */
const INITIAL_BUDGET=600, EXCHANGE_RATE=31.5;
let expenses=[];
try{const sv=JSON.parse(localStorage.getItem('sf_expenses'));if(Array.isArray(sv))expenses=sv.filter(e=>e&&typeof e.amount==='number'&&isFinite(e.amount));}catch(e){expenses=[];}
const saveExpenses=()=>{try{localStorage.setItem('sf_expenses',JSON.stringify(expenses));}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function updateBudgetUI(){
 const spent=expenses.reduce((s,x)=>s+x.amount,0),rem=INITIAL_BUDGET-spent,$=id=>document.getElementById(id),tw=v=>Math.round(v*EXCHANGE_RATE).toLocaleString();
 $('total-budget').innerText=INITIAL_BUDGET;$('total-spent').innerText=spent.toFixed(2);$('remaining-budget').innerText=rem.toFixed(2);
 $('total-budget-twd').innerText=tw(INITIAL_BUDGET);$('total-spent-twd').innerText=tw(spent);$('remaining-budget-twd').innerText=tw(rem);
 document.querySelector('.budget-stats .remaining').style.color=rem<0?'#e74c3c':'#27ae60';
 const tb=$('expense-tbody');tb.innerHTML='';
 expenses.forEach((x,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(x.name)}</td><td>$${x.amount.toFixed(2)}</td><td style="color:#666">NT$${tw(x.amount)}</td><td style="text-align:center"><button class="delete-btn-table" title="刪除" onclick="deleteExpense(${i})">×</button></td>`;tb.appendChild(tr);});
 $('table-total-usd').innerText='$'+spent.toFixed(2);$('table-total-twd').innerText='NT$'+tw(spent);
}
function bad(el){el.style.borderColor='#e74c3c';setTimeout(()=>el.style.borderColor='var(--border-color)',1500);}
function addExpense(){const n=document.getElementById('expense-name'),a=document.getElementById('expense-amount'),v=parseFloat(a.value);if(isNaN(v)||v<=0)return bad(a);expenses.push({name:n.value||'未命名',amount:v});saveExpenses();n.value='';a.value='';updateBudgetUI();}
function deleteExpense(i){expenses.splice(i,1);saveExpenses();updateBudgetUI();}
function addInlineExpense(btn){
 const c=btn.closest('.inline-expense-container'),a=c.querySelector('.inline-amount'),v=parseFloat(a.value);
 if(isNaN(v)||v<=0)return bad(a);
 expenses.push({name:c.querySelector('.inline-name').value.trim()||'未命名',amount:v});saveExpenses();a.value='';updateBudgetUI();
 const o=btn.innerText;btn.innerText='已記帳 ✓';btn.style.backgroundColor='#27ae60';setTimeout(()=>{btn.innerText=o;btn.style.backgroundColor='var(--secondary-color)';},1500);
}

/* ---------- 完成 / 略過 / 改時間 狀態 ---------- */
const KEY='sf_itin_state';
let st={};try{st=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){st={};}
const saveSt=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
const reg=[]; // {id,day,item,li,cb,tt,skipBtn,orig,prog}
function mutate(id,fn){const s=st[id]||{};fn(s);if(!s.done&&!s.skipped&&!s.time)delete st[id];else st[id]=s;saveSt();refresh();}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;d.querySelectorAll('.tl-tag,.highlight-tag').forEach(n=>n.remove());return d.textContent.trim();};

function build(){
 const root=document.getElementById('days');
 DAYS.forEach(day=>{
  const card=document.createElement('div');card.className='day-card';card.id=day.id;
  card.innerHTML=`<h2 class="day-header"><span>${day.h}</span><span>${day.sub}</span><span class="day-progress"></span></h2>`+(day.warn?`<div class="warning-wrap"><div class="warning-text">${day.warn}</div></div>`:'')+'<ul class="timeline"></ul>';
  const ul=card.querySelector('.timeline'),prog=card.querySelector('.day-progress');
  day.items.forEach((it,i)=>{
   const id=day.id+'-'+i,li=document.createElement('li');li.className='timeline-item';
   li.innerHTML=`<div class="time-col"><div class="time-row">${it.s?'<input type="checkbox" class="done-cb" aria-label="完成">':''}<span class="time-text"></span></div><div class="item-tools"><button class="edit-btn">✏️ 改時間</button><button class="skip-btn"></button></div><div class="time-editor"><input type="text" placeholder="例：約 15:30"><button class="save">儲存</button><button class="rs">還原</button></div></div><div class="content-col"><h3 class="location-title">${it.h}</h3>${it.b||''}</div>`;
   const r={id,day,item:it,li,prog,orig:it.t,cb:li.querySelector('.done-cb'),tt:li.querySelector('.time-text'),skipBtn:li.querySelector('.skip-btn')};
   const ed=li.querySelector('.time-editor'),inp=ed.querySelector('input');
   if(r.cb)r.cb.addEventListener('change',()=>mutate(id,s=>{s.done=r.cb.checked;}));
   r.skipBtn.addEventListener('click',()=>mutate(id,s=>{s.skipped=!s.skipped;if(s.skipped)s.done=false;}));
   li.querySelector('.edit-btn').addEventListener('click',()=>{inp.value=(st[id]&&st[id].time)||it.t;ed.classList.toggle('open');});
   ed.querySelector('.save').addEventListener('click',()=>{const v=inp.value.trim();mutate(id,s=>{if(!v||v===it.t)delete s.time;else s.time=v;});ed.classList.remove('open');});
   ed.querySelector('.rs').addEventListener('click',()=>{mutate(id,s=>{delete s.time;});ed.classList.remove('open');});
   ul.appendChild(li);reg.push(r);
  });
  root.appendChild(card);
 });
}

function refresh(){
 reg.forEach(r=>{
  const s=st[r.id]||{};
  r.li.classList.toggle('done',!!s.done);r.li.classList.toggle('skipped',!!s.skipped);
  if(r.cb){r.cb.checked=!!s.done;r.cb.style.visibility=s.skipped?'hidden':'visible';}
  r.tt.textContent=s.time||r.orig;
  if(s.time){const g=document.createElement('span');g.className='edited-tag';g.textContent='已調整';r.tt.appendChild(g);}
  r.skipBtn.textContent=s.skipped?'↩︎ 放回行程':'⏭️ 先跳過';r.skipBtn.classList.toggle('on',!!s.skipped);
 });
 DAYS.forEach(day=>{
  const spots=reg.filter(r=>r.day===day&&r.item.s&&!(st[r.id]||{}).skipped),done=spots.filter(r=>(st[r.id]||{}).done).length;
  const sk=reg.filter(r=>r.day===day&&r.item.s&&(st[r.id]||{}).skipped).length;
  day.items.length&&(reg.find(r=>r.day===day).prog.textContent=`✅ 景點/餐廳完成 ${done} / ${spots.length}`+(sk?`（先跳過 ${sk}）`:''));
 });
 renderTodo();
}

/* ---------- 未完成清單 ---------- */
let showAll=false;
function todayIdx(){const start=new Date(2026,10,12),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((t-start)/86400000)+1;}
function renderTodo(){
 const t=todayIdx(),box=document.getElementById('todo-list'),intro=document.getElementById('todo-intro');
 const pending=r=>r.item.s&&!(st[r.id]||{}).done&&!(st[r.id]||{}).skipped;
 const visible=DAYS.filter(d=>showAll||d.n<=t);
 let total=0;box.innerHTML='';
 visible.forEach(day=>{
  const rows=reg.filter(r=>r.day===day&&pending(r));
  if(!rows.length)return;
  total+=rows.length;
  const sec=document.createElement('div');sec.className='todo-day';
  sec.innerHTML=`<h3>${day.h.replace(/\s*\(.*\)/,'')}　${day.h.match(/\((.*)\)/)[1]}${day.n<t?'（已過）':day.n===t?'（今天）':''}</h3>`;
  rows.forEach(r=>{
   const row=document.createElement('div');row.className='todo-row';
   row.innerHTML=`<input type="checkbox" class="done-cb" aria-label="完成"><div class="todo-main"><b></b><small></small></div><a href="#${day.id}">看卡片</a><button>⏭️ 先跳過</button>`;
   row.querySelector('b').textContent=plain(r.item.h);
   row.querySelector('small').textContent='原訂 '+((st[r.id]||{}).time||r.orig);
   row.querySelector('input').addEventListener('change',()=>mutate(r.id,s=>{s.done=true;}));
   row.querySelector('button').addEventListener('click',()=>mutate(r.id,s=>{s.skipped=true;s.done=false;}));
   sec.appendChild(row);
  });
  box.appendChild(sec);
 });
 const sr=reg.filter(r=>r.item.s&&(st[r.id]||{}).skipped);
 if(sr.length){const sec=document.createElement('div');sec.className='todo-day';sec.innerHTML='<h3>⏭️ 先跳過・有空再去（'+sr.length+'）</h3>';
  sr.forEach(r=>{const row=document.createElement('div');row.className='todo-row';row.innerHTML='<input type="checkbox" class="done-cb" aria-label="完成"><div class="todo-main"><b></b><small></small></div><a href="#'+r.day.id+'">看卡片</a><button>↩︎ 放回行程</button>';
   row.querySelector('b').textContent=plain(r.item.h);row.querySelector('small').textContent=r.day.h.replace(/\s*\(.*\)/,'')+'・原訂 '+r.orig;
   row.querySelector('input').addEventListener('change',()=>mutate(r.id,s=>{s.skipped=false;s.done=true;}));
   row.querySelector('button').addEventListener('click',()=>mutate(r.id,s=>{s.skipped=false;}));sec.appendChild(row);});box.appendChild(sec);}
 const past=DAYS.filter(d=>d.n<t).reduce((n,d)=>n+reg.filter(r=>r.day===d&&pending(r)).length,0)+sr.length;
 const badge=document.getElementById('todo-badge');badge.textContent=past;badge.style.display=past?'inline':'none';
 let msg=t<1?'旅程還沒開始，出發後這裡會自動列出前幾天沒完成的景點與餐廳。':t>5?'旅程已結束，以下是沒去到的地方。':`今天是 Day ${t}。這裡列出今天以前還沒勾選完成、也沒按「先跳過」的景點與餐廳；先跳過的放在下方，有空再補。`;
 intro.innerHTML=`<div>${msg}</div><div style="margin-top:8px;font-weight:bold">待處理：${total} 個</div><button id="toggle-all" style="margin-top:10px;height:36px;font-size:13px!important;background:#e8eaee;color:var(--primary-color);width:auto">${showAll?'只看今天以前':'顯示全部天數'}</button>`;
 document.getElementById('toggle-all').onclick=()=>{showAll=!showAll;renderTodo();};
 if(!total&&!sr.length)box.innerHTML='<div class="todo-day"><div class="todo-empty">🎉 目前沒有未完成的項目</div></div>';
}

/* ---------- 路由（#todo / 其他 = 行程） ---------- */
function route(){
 const h=location.hash.slice(1),todo=h==='todo';
 document.getElementById('view-itin').style.display=todo?'none':'block';
 document.getElementById('view-todo').style.display=todo?'block':'none';
 document.getElementById('day-nav').style.display=todo?'none':'flex';
 document.getElementById('tab-itin').classList.toggle('active',!todo);document.getElementById('tab-todo').classList.toggle('active',todo);
 if(todo)window.scrollTo(0,0);
 else if(/^day\d$/.test(h)){const el=document.getElementById(h);el&&el.scrollIntoView();}
}

function injectInlineExpenses(){
 document.querySelectorAll('.timeline-item .content-col').forEach(col=>{
  const d=document.createElement('div');d.className='inline-expense-container';
  d.innerHTML='<input type="text" class="inline-name"><div class="inline-action-row"><input type="number" class="inline-amount" placeholder="金額 ($)" step="0.01"><button onclick="addInlineExpense(this)">記一筆</button></div>';
  d.querySelector('.inline-name').value=col.querySelector('.location-title').innerText+' ';col.appendChild(d);
 });
}

document.addEventListener('DOMContentLoaded',()=>{
 build();injectInlineExpenses();updateBudgetUI();refresh();
 document.getElementById('reset-all').addEventListener('click',()=>{if(confirm('確定要清除所有完成、略過與時間調整嗎？')){st={};saveSt();refresh();}});
 window.addEventListener('hashchange',route);route();
});
</script>
</body>
